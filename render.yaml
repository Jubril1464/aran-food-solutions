# Render Blueprint: the whole deployment, in one file.
#
# Two free services - a Python web service for the API and a static site for the
# React frontend - plus an external Postgres (Neon). Deployed straight from this
# repo: no Docker image, no container registry, no build machine of your own.
#
# The database is deliberately NOT declared here. Render's free Postgres is
# deleted 30 days after creation, which is a bad property for a demo you want to
# still work next month, so DATABASE_URL points at a Neon project instead - whose
# free tier is permanent. See DEPLOY.md.
#
# Values marked `sync: false` are the ones you set once in the dashboard, because
# each depends on a URL that doesn't exist until the services are created.

services:
  # ---------------------------------------------------------------- API -------
  - type: web
    name: aran-food-api
    runtime: python
    plan: free
    region: frankfurt # closest of Render's regions to Nigeria; keep Neon in the EU too
    rootDir: backend
    healthCheckPath: /health

    buildCommand: pip install -r requirements.txt
    # `sh start.sh` rather than `./start.sh`: avoids depending on the executable
    # bit surviving a checkout from a Windows working tree.
    startCommand: sh start.sh

    envVars:
      # Pinned rather than left to Render's default: every dependency here is
      # verified to have a Linux wheel for CPython 3.12, so nothing has to be
      # compiled during the build.
      - key: PYTHON_VERSION
        value: 3.12.11

      - key: ENVIRONMENT
        value: production

      # Neon connection string. Paste it exactly as Neon gives it to you -
      # app/core/database.py rewrites the scheme for asyncpg and strips the
      # libpq-only parameters (sslmode, channel_binding) that would otherwise
      # crash the driver on the first query.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRED
        value: "true"

      # Generated by Render and never seen by anyone. Changing it invalidates
      # every issued token, which is the correct behaviour for a secret rotation.
      - key: JWT_SECRET
        generateValue: true

      # The frontend's URL, as a JSON array, e.g.
      #   ["https://aran-food-web.onrender.com"]
      - key: CORS_ORIGINS
        sync: false
      # Same URL without the array, used to build links inside emails and the
      # Paystack return URL, e.g. https://aran-food-web.onrender.com
      - key: FRONTEND_URL
        sync: false

      # The API and the frontend are served from different hostnames, so the
      # browser treats API calls as cross-site and will not send a SameSite=Lax
      # cookie - silent token refresh would fail on every page load. "none"
      # implies Secure, which is satisfied because Render terminates TLS.
      - key: REFRESH_COOKIE_SAMESITE
        value: none

      # A background task in this same process. No Redis, no second service -
      # which is what keeps this deployable on one free instance.
      - key: QUEUE_BACKEND
        value: in_process

      # Free instances have no persistent disk: uploaded product images survive
      # until the next deploy or spin-down. Set STORAGE_BACKEND=s3 with any
      # S3-compatible bucket (Supabase Storage, B2, R2) to make them durable.
      - key: STORAGE_BACKEND
        value: local

      # Logs the email body instead of sending it - visible in the Render logs.
      # Switch to "smtp" and fill in the SMTP_* variables for real delivery.
      - key: EMAIL_BACKEND
        value: console

      # Blank runs Paystack in its built-in mock mode, so checkout still works
      # end to end without a Paystack account.
      - key: PAYSTACK_SECRET_KEY
        sync: false

      # First-admin bootstrap, applied by start.sh on every boot (idempotent).
      #
      # Change the address to your own to receive password-reset mail. It must not
      # be a .local or .test domain: those are RFC 6761 special-use names that
      # email validation rejects, which would leave the admin unable to log in at
      # all - the login request would fail validation before checking the password.
      - key: SEED_ADMIN_EMAIL
        value: admin@aranfood.example
      # Generated by Render: read it once from this service's Environment tab,
      # then log in with it.
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"

  # ----------------------------------------------------------- Frontend -------
  - type: web
    name: aran-food-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      # Baked into the bundle at build time, so this must be set before the first
      # build to be useful: the API service's URL plus the API prefix, e.g.
      #   https://aran-food-api.onrender.com/api/v1
      - key: VITE_API_BASE_URL
        sync: false

    routes:
      # Client-side routing: every path that isn't a real file has to return
      # index.html, or a refresh on /orders or /admin/products 404s.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /assets/*
        name: Cache-Control
        # Vite fingerprints these filenames, so a stale one can never be served
        # for new content.
        value: public, max-age=31536000, immutable
