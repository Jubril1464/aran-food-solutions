# Render Blueprint — the hosted demo.
#
# One free static site, no backend and no database, because the frontend runs in
# demo mode: the whole API is served from sample data inside the browser
# (frontend/src/api/demo/). Everything works end to end — catalogue, cart,
# minimum order quantities, checkout, the mock payment, order tracking and the
# admin screens — with nothing to provision and nothing to pay for.
#
# There are no `sync: false` values here on purpose: Render can create this
# without asking you for anything.
#
# To put the real backend behind it later, see render.backend.yaml and the
# "Adding the real backend" section of DEPLOY.md.

services:
  - type: web
    name: aran-food-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      # The switch. With this off, the app expects a live API at
      # VITE_API_BASE_URL instead.
      - key: VITE_DEMO_MODE
        value: "true"

    routes:
      # Client-side routing: every path that isn't a real file has to return
      # index.html, or a refresh on /orders or /admin/products 404s.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /assets/*
        name: Cache-Control
        # Vite fingerprints these filenames, so a stale one can never be served
        # for new content.
        value: public, max-age=31536000, immutable
